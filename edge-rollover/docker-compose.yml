services:
  edge-rollover:
    build: .
    image: edge-rollover:latest
    container_name: edge-rollover
    # 默认目录模式（USE_LOOP_IMAGES=0），无需特权，拔盘/错装直接用
    # mv/cp 操作 /data/pN 目录即可模拟。
    # 真机 loop 镜像模式启动：
    #   USE_LOOP_IMAGES=1 PRIVILEGED=1 docker compose up -d --build
    privileged: ${PRIVILEGED:-false}
    ports:
      - "8080:8080"
    environment:
      DATA_DIR: /data
      # 与 loop 镜像大小保持一致
      PARTITION_CAPACITY: "67108864"          # 64 MiB
      PARTITION_COUNT: "3"
      ENABLE_TEST_HOOKS: "1"                  # 验收测试用；生产置 0
      DRAIN_POLL_INTERVAL: "2"
      # 0=普通目录（默认，便于模拟拔盘/错装）；1=loop 镜像+ext4（需 PRIVILEGED=1）
      USE_LOOP_IMAGES: "${USE_LOOP_IMAGES:-0}"
    volumes:
      - rollover-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/api/overview')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  rollover-data:
